name: Founder50 optimized isolated acceptance
on:
  workflow_dispatch:
    inputs:
      reviewed_control_sha:
        description: Exact separately reviewed control commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: founder50-optimized-isolated-single-run
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/ci/founder50-enabled-optimized-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Assert dispatch and reviewed control identity
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.reviewed_control_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ebe9b0920fcb7d5757a1c0127cf98dae9b896614
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify exact application and no private environment files
        working-directory: app
        run: |
          test "$(git rev-parse HEAD)" = ebe9b0920fcb7d5757a1c0127cf98dae9b896614
          test "$(git rev-parse HEAD^{tree})" = e13fa6a6aa1c1b906156be2975c243b36d551a6f
          test -z "$(git status --porcelain --untracked-files=no)"
          for f in .env .env.local .env.production .env.production.local .vercel/project.json; do
            test ! -e "$f"
          done
      - name: Locked installation and optimized enabled build
        working-directory: app
        env:
          NEXT_PUBLIC_FOUNDER50_ENABLED: 'true'
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9/api/v1
          BACKEND_API_BASE_URL: http://127.0.0.1:9/api/v1
          NEXT_PUBLIC_WS_BASE_URL: ws://127.0.0.1:9
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          mkdir -p ../evidence
          npm ci
          npx --no-install playwright install --with-deps chromium
          npm run build > ../evidence/build.log 2>&1
          git rev-parse HEAD HEAD^{tree} > ../evidence/source.txt
          sha256sum package-lock.json >> ../evidence/source.txt
          cat .next/BUILD_ID >> ../evidence/source.txt
      - name: Isolated optimized browser acceptance
        run: |
          bash control/ci/launch-isolated-acceptance.sh
      - name: Sanitize synthetic diagnostics before upload
        id: sanitize
        if: always()
        run: python3 control/ci/sanitize-evidence.py evidence evidence-sanitized
      - name: Retain sanitized synthetic evidence only
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: founder50-optimized-isolated-${{ github.run_id }}
          path: evidence-sanitized/
          if-no-files-found: error
          retention-days: 7
